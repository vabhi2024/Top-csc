<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<title>Contact Us | Sarkari Sites</title>

<style>
body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#0d1b2a;
    color:#fff;
}

/* Header */
header{
    background:#000;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:700;
    color:#fff;
}

.logo span{
    color:#ffd000;
}

/* Main Container */
.container{
    width:92%;
    margin:auto;
    padding-top:20px;
}

/* Form Box */
.form-box{
    background:rgba(255,255,255,0.06);
    padding:20px;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:10px;
    backdrop-filter:blur(3px);
}

h2{
    color:#ffd000;
    margin-bottom:10px;
}

label{
    font-size:15px;
    font-weight:500;
}

input,textarea{
    width:100%;
    padding:10px;
    margin-top:6px;
    margin-bottom:15px;
    border:none;
    border-radius:6px;
    background:#112233;
    color:#fff;
    font-size:14px;
}

input::placeholder,
textarea::placeholder{
    color:#b8c6d1;
}

button{
    width:100%;
    padding:12px;
    background:#ffd000;
    border:none;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    color:#000;
    transition:0.3s;
}

button:hover{
    background:#ffde3d;
}

/* Contact Info Box */
.info{
    margin-top:25px;
    background:rgba(255,255,255,0.06);
    padding:18px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.15);
}

.info h3{
    color:#00eaff;
    margin-bottom:10px;
}

/* Footer */
footer{
    margin-top:30px;
    background:#000;
    padding:25px;
    text-align:center;
    font-size:14px;
    color:#ccc;
}

footer a{
    color:#00d4ff;
    text-decoration:none;
    margin:0 8px;
}
</style>
</head>

<body>

<header>
    <div class="logo">Top <span>CSC</span></div>
</header>

<div class="container">

<div class="form-box">
<h2>Contact Us</h2>

<label>नाम</label>
<input type="text" placeholder="अपना नाम लिखें">

<label>ईमेल</label>
<input type="email" placeholder="आपका ईमेल">

<label>संदेश</label>
<textarea rows="4" placeholder="अपना संदेश लिखें"></textarea>

<button>संदेश भेजें</button>
</div>

<div class="info">
<h3>📞 संपर्क जानकारी</h3>
<p>📍 <b>Address:</b> Lucknow Uttar Pradesh 225001</p>
<p>📧 <b>Email:</b> support@topcsc.net</p>
<p>📱 <b>Phone:</b> +91 8005389500</p>
<p>⏰ <b>Support:</b> 24×7 उपलब्ध</p>
</div>

</div>

<footer>

</footer>

</body>
</html>
